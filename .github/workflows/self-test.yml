# Exercises the JS action against this very repository via `uses: ./`.
# We never want this to run on push (no accidental release PRs against the fork),
# so the trigger is workflow_dispatch only.
name: Self Test
on:
  workflow_dispatch:
    inputs:
      command:
        description: "Which subcommand to run (release-pr, github-release, both)."
        default: "release-pr"
        type: choice
        options:
          - release-pr
          - github-release
          - both
jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Mint a short-lived installation token for the Increase Releases GitHub App.
      # Using App auth (instead of a PAT) means commits/PRs opened by the action
      # are authored by `increase-releases[bot]` and trigger downstream workflows,
      # both of which `GITHUB_TOKEN` cannot do.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.INCREASE_RELEASES_CLIENT_ID }}
          private-key: ${{ secrets.INCREASE_RELEASES_PRIVATE_KEY }}

      - uses: actions/checkout@v7

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # main does not commit dist/, so the bundle that `uses: ./` resolves
      # to must be built in-tree here. Mirrors the same step in release.yml.
      - name: Build action bundle
        run: pnpm build:action

      - name: Run release-please
        id: release_please
        uses: ./
        with:
          token: ${{ steps.app-token.outputs.token }}
          command: ${{ inputs.command }}

      - name: Print release-please outputs
        env:
          OUTPUTS: ${{ toJson(steps.release_please.outputs) }}
        run: |
          echo "$OUTPUTS"
